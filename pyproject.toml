[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-jks-truststore-review"
version = "0.1.2"
authors = [{name = "dhtfish98"}]
description = "Bounded JKS v2 public truststore inventory, Java modified UTF-8 decoding, certificate parsing and validity/CA/key policy, with explicit externally pinned file digest."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
jks-truststore-review = "jks_truststore_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
